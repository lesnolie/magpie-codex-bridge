name: Node test suite
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        if: runner.os != 'Windows'
      # Windows integration tests share one HKCU Run key; serialize test files.
      - run: node --test --test-concurrency=1 test/*.test.mjs
        if: runner.os == 'Windows'
      - run: npm run check
